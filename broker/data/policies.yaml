# ============================================================
# changeguard Secure Broker — Policy Configuration
# ============================================================

policies:
  - agent_id: "change-impact-agent"
    allowed_tools:
      # Execution tools
      - "run_tests"
      - "comment_pr"
      - "merge_pr"
      - "deploy_canary"
      - "monitor"
      - "deploy_full"
      - "rollback"
    scope: "ci-cd-execution"
    max_session_minutes: 30
    token_budget: 50000
    require_approval_for:
      - "comment_pr"
      - "merge_pr"
      - "deploy_full"
      - "rollback"

  - agent_id: "rogue-agent"
    allowed_tools: []
    scope: "none"
    action: "BLOCK"